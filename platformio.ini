; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs

upload_protocol = espota
upload_port = esp32-waterlevel.local  ; Use the mDNS hostname instead of IP

upload_flags =
;   -aincorrectPassword

; Optional: Debugging
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_OTA=1
  -Os


lib_deps = 
	bblanchon/ArduinoJson@^7.1.0
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit SSD1306@^2.5.11
	; Pinned, and not a floating git URL. That line fetched whatever was on
	; me-no-dev's default branch on the day of the build, which by 2026 was
	; 3.6.0 -- the release goodwe-bridge found crashes on an SSE client
	; disconnect. That repo is unmaintained; ESP32Async carries it on, and
	; goodwe is already on the same 3.12.0.
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.0
